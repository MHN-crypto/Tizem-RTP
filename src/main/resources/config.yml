menu-title: "Random Teleport"

# Countdown seconds before teleporting
countdown: 3
cancel-on-move: true

# Random spots to try before giving up
max-attempts: 40

# world: "auto" finds the world by dimension type. Or put an exact world name.
overworld:
  world: auto
  min-radius: 500
  max-radius: 5000

nether:
  world: auto
  min-radius: 100
  max-radius: 1000

end:
  world: auto
  min-radius: 1000
  max-radius: 10000
  max-attempts: 150

spawn:
  world: auto

prefix: "RTP"
prefix-color: "#9DFF1F"
accent-color: "#9DFF1F"
arrow: "»"

# Seconds between random teleports (spawn is not limited)
rtp-cooldown: 30
